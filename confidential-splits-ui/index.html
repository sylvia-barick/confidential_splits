<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010102" />
    <meta
      name="description"
      content="Confidential Splits - a privacy-preserving group expense tracker and settlement dApp on the Midnight Network. Balances, blinding salts and witness keys stay private; only ZK commitments touch the public ledger."
    />
    <meta property="og:title" content="Confidential Splits" />
    <meta
      property="og:description"
      content="Split shared costs and settle debts with zero-knowledge privacy on Midnight Preprod."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Confidential Splits — Private Group Settlements on Midnight</title>

    <style>
      html,
      body {
        margin: 0;
        background: #010102;
      }

      /* Pre-hydration splash — flat charcoal panel, single lavender accent,
         no atmospheric gradients or glow. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #010102;
        font-family: 'Inter', system-ui, sans-serif;
        color: #f7f8f8;
        z-index: 9999;
        transition: opacity 0.55s ease;
      }
      #boot-splash .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2.5px solid #23252a;
        border-top-color: #5e6ad2;
        animation: boot-spin 0.85s linear infinite;
      }
      #boot-splash .brand {
        font-weight: 600;
        letter-spacing: 0.06em;
        font-size: 12px;
        text-transform: uppercase;
        color: #f7f8f8;
      }
      #boot-splash .sub {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        color: #8a8f98;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .ring { animation: none !important; }
      }
      body.app-ready #boot-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="ring"></div>
      <div class="brand">Confidential Splits</div>
      <div class="sub">Initialising Midnight providers…</div>
    </div>
    <div id="root"></div>
    <script>`n      // Never leave a failed module/provider startup behind an infinite spinner.`n      window.setTimeout(() => {`n        const splash = document.getElementById("boot-splash");`n        if (splash && !document.body.classList.contains("app-ready")) {`n          const message = splash.querySelector(".sub");`n          if (message) message.textContent = "Startup is taking too long. Check the wallet connection and browser console.";`n          splash.querySelector(".ring")?.remove();`n        }`n      }, 15000);`n      window.addEventListener("error", (event) => {`n        const message = document.querySelector("#boot-splash .sub");`n        if (message && !document.body.classList.contains("app-ready")) {`n          message.textContent = `Startup error: ${event.message || "Unable to load the app"}`;`n        }`n      });`n    </script>`n    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
